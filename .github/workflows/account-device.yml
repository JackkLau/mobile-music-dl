name: Android device checks
on:
  workflow_dispatch:
  push:
    branches: [master]
    paths:
      - '.github/workflows/account-device.yml'
      - 'app/src/main/java/app/tingyu/auth/**'
      - 'app/src/main/java/app/tingyu/data/auth/**'
      - 'app/src/main/java/app/tingyu/update/**'
      - 'app/src/main/java/app/tingyu/ui/AppUpdateCard.kt'
      - 'app/src/main/res/**'
      - 'app/src/main/java/app/tingyu/data/music/**'
      - 'app/src/main/java/app/tingyu/download/**'
      - 'app/src/main/java/app/tingyu/ui/ParseScreen.kt'
      - 'app/src/androidTest/java/app/tingyu/download/**'
      - 'app/src/androidTest/java/app/tingyu/ui/BrandResourcesTest.kt'
      - 'app/src/androidTest/java/app/tingyu/ui/LoginScreenTest.kt'
      - 'app/src/androidTest/java/app/tingyu/update/**'
permissions:
  contents: read
jobs:
  device:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools'
          log-accepted-android-sdk-licenses: false
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Build debug app and device tests
        run: gradle --no-daemon :app:assembleDebug :app:assembleDebugAndroidTest
      - name: Run brand, login and update checks on a disposable Android device
        env:
          TINGYU_TEST_DEVICE: emulator-5554
          TINGYU_TEST_CLASSES: app.tingyu.data.local.LocalMusicIntegrationTest#completedMediaScanIsRepeatableAndPreservesExistingMetadata,app.tingyu.download.DownloadFolderDeviceTest,app.tingyu.download.MusicDownloadIntegrationTest,app.tingyu.ui.TingYuUiTest#musicLoginDialogOffersBothMethodsForTheExactRequest,app.tingyu.ui.TingYuUiTest#sharedSongHasPlatformOptionsAndDownloadAction,app.tingyu.ui.TingYuUiTest#failedDownloadKeepsErrorAndOffersTargetedRetry,app.tingyu.ui.BrandResourcesTest,app.tingyu.ui.LoginScreenTest,app.tingyu.ui.TingYuUiTest#accountProvidesUpdatesWithoutLoginOrDeveloperMode
        run: |
          set -euo pipefail
          sudo apt-get install -y libpulse0 libxkbcommon-x11-0 libxcb-cursor0
          # Leave room for the guest image and its writable data on this disposable host.
          sudo rm -rf /usr/local/lib/android/sdk/ndk /usr/share/dotnet
          sdkmanager 'emulator' 'system-images;android-30;google_apis;x86_64' > "$RUNNER_TEMP/sdk-install.log"
          export ANDROID_USER_HOME="$RUNNER_TEMP/account-android"
          export ANDROID_AVD_HOME="$ANDROID_USER_HOME/avd"
          mkdir -p "$ANDROID_AVD_HOME"
          echo no | avdmanager create avd -n account-ui -p "$ANDROID_AVD_HOME/account-ui.avd" -k 'system-images;android-30;google_apis;x86_64' -d pixel_4
          # Some SDK tools store the index under XDG_CONFIG_HOME despite the explicit AVD path.
          test -s "$ANDROID_AVD_HOME/account-ui.avd/config.ini"
          printf 'avd.ini.encoding=UTF-8\npath=%s\ntarget=android-30\n' "$ANDROID_AVD_HOME/account-ui.avd" > "$ANDROID_AVD_HOME/account-ui.ini"
          "$ANDROID_HOME/emulator/emulator" -list-avds | grep -qx account-ui
          sudo setfacl -m "u:$(id -un):rw" /dev/kvm
          adb start-server
          "$ANDROID_HOME/emulator/emulator" -avd account-ui -port 5554 -no-window -no-audio -no-boot-anim -no-snapshot -gpu swiftshader -feature -Vulkan -cores 2 -memory 2048 -partition-size 2048 > "$RUNNER_TEMP/emulator.log" 2>&1 &
          emulator_pid=$!
          trap 'status=$?; if [[ "$status" != 0 ]]; then tail -80 "$RUNNER_TEMP/emulator.log"; fi; adb -s emulator-5554 emu kill || true' EXIT
          for i in {1..120}; do
            kill -0 "$emulator_pid"
            if [[ "$(adb -s "$TINGYU_TEST_DEVICE" get-state 2>/dev/null || true)" == device ]]; then break; fi
            sleep 2
          done
          [[ "$(adb -s "$TINGYU_TEST_DEVICE" get-state)" == device ]]
          timeout 240 bash -c 'until [[ "$(adb shell getprop sys.boot_completed | tr -d "\r")" == 1 ]]; do sleep 2; done'
          adb shell input keyevent 82
          TINGYU_TEST_USER=$(adb shell pm create-user WeileTest | sed -nE 's/.* id ([0-9]+).*/\1/p')
          [[ "$TINGYU_TEST_USER" =~ ^[1-9][0-9]*$ ]]
          export TINGYU_TEST_USER
          adb shell am switch-user "$TINGYU_TEST_USER"
          timeout 180 bash -c 'until adb shell am get-current-user | tr -d "\r" | grep -qx "$TINGYU_TEST_USER" && adb shell am get-started-user-state "$TINGYU_TEST_USER" | grep -q RUNNING_UNLOCKED; do sleep 1; done'
          adb shell wm dismiss-keyguard
          # Exercise archive parsing with a genuine earlier release, including signature checks.
          curl --fail --location --retry 3 -o "$RUNNER_TEMP/official.apk" https://github.com/JackkLau/mobile-music-dl/releases/download/v0.1.6/tingyu-0.1.6-release.apk
          echo "04c39178da5b6b6c80ff70739b719d6012759d1e77dfeca0f70eab7aedd40979  $RUNNER_TEMP/official.apk" | sha256sum -c -
          adb install --user "$TINGYU_TEST_USER" -r app/build/outputs/apk/debug/app-debug.apk
          adb shell -T "run-as app.tingyu --user $TINGYU_TEST_USER sh -c 'mkdir -p cache && cat > cache/update-test-release.apk'" < "$RUNNER_TEMP/official.apk"
          # Model the user authorizing this installation source in Android Settings.
          adb -s "$TINGYU_TEST_DEVICE" shell appops set --user "$TINGYU_TEST_USER" app.tingyu REQUEST_INSTALL_PACKAGES allow
          run_device_checks() {
            if ! bash scripts/check-device.sh; then
              adb -s "$TINGYU_TEST_DEVICE" logcat -d -b crash -t 100
              adb -s "$TINGYU_TEST_DEVICE" logcat -d -b events -s am_kill:I am_proc_died:I am_crash:I am_anr:I | tail -40
              adb -s "$TINGYU_TEST_DEVICE" logcat -d -s TestRunner:I WeileInstallerTest:I lmkd:I AndroidRuntime:E ActivityTaskManager:I | tail -120
              return 1
            fi
          }
          TINGYU_TEST_CLASSES=app.tingyu.update.UpdatePackageIntegrationTest run_device_checks
          run_device_checks
